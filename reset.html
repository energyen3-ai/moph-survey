<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตั้งรหัสผ่านใหม่ | ระบบสำรวจข้อมูล สป.สธ.</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5" style="max-width: 480px;">
    <div class="card p-4">
      <h1 class="h5 fw-bold mb-3"><i class="bi bi-key me-2"></i>ตั้งรหัสผ่านใหม่</h1>
      <form id="formReset">
        <div class="mb-3">
          <label class="form-label" for="newPassword">รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</label>
          <input type="password" class="form-control" id="newPassword" required minlength="8" autocomplete="new-password">
        </div>
        <button class="btn btn-primary w-100" type="submit">บันทึกรหัสผ่านใหม่</button>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { sb, toast, errMsg } from './js/app.js';
    document.getElementById('formReset').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.updateUser({ password: document.getElementById('newPassword').value });
      if (error) return toast(errMsg(error), 'danger');
      toast('เปลี่ยนรหัสผ่านสำเร็จ', 'success');
      setTimeout(() => location.replace('home.html'), 1200);
    });
  </script>
</body>
</html>
